; https://docs.platformio.org/page/projectconf.html

[env:adafruit_clue_nrf52840]
platform = nordicnrf52
board = adafruit_clue_nrf52840
framework = arduino
lib_deps = 
	adafruit/Adafruit GFX Library@^1.11.3
	adafruit/Adafruit ST7735 and ST7789 Library@^1.9.3
	contrem/arduino-timer@^2.3.1
	adafruit/Adafruit SPIFlash@^3.11.0
	adafruit/Adafruit ImageReader Library@^2.8.1
	adafruit/SdFat - Adafruit Fork@^1.5.1
	adafruit/Adafruit EPD@^4.5.0
