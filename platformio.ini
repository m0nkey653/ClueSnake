[env:adafruit_clue_nrf52840]
platform = nordicnrf52
board = adafruit_clue_nrf52840
framework = arduino
lib_deps =
	adafruit/Adafruit GFX Library@1.12.6
	adafruit/Adafruit ST7735 and ST7789 Library@1.11.0
	contrem/arduino-timer@2.3.1
	adafruit/Adafruit SPIFlash@5.1.1
	adafruit/Adafruit ImageReader Library@2.12.0
	adafruit/SdFat - Adafruit Fork@2.3.103
	adafruit/Adafruit EPD@4.6.14
